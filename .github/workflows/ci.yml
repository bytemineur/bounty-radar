name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 依赖自检（本项目零第三方依赖）
        run: |
          python -c "import sqlite3, urllib.request, json; print('stdlib ok')"

      - name: 解析器回归测试
        run: python -m unittest tests.test_parser -v

      - name: 看板交互回归（无头 Chrome）
        if: matrix.python == '3.12'
        run: python tests/run_ui_test.py

      - name: 导出管线冒烟测试
        if: matrix.python == '3.12'
        run: |
          python cli.py export
          test -s web/data/bounties.js
          python cli.py stats | head -5

  docker:
    name: 镜像构建与冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bounty-radar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 起容器并请求首页
        run: |
          docker run -d --name br -p 8848:8848 bounty-radar:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8848/index.html -o /tmp/index.html; then break; fi
            sleep 1
          done
          grep -q "执行悬赏公告看板" /tmp/index.html
          curl -fsS http://127.0.0.1:8848/data/bounties.js -o /tmp/b.js
          grep -q "__BOUNTY_DATA__" /tmp/b.js
          echo "容器健康检查: $(docker inspect -f '{{.State.Health.Status}}' br)"

      - name: 清理
        if: always()
        run: |
          docker rm -f br 2>/dev/null || true
          docker logs br 2>/dev/null | tail -20 || true
